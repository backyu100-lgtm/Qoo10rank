name: Qoo10 Rank Tracker

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 랭킹 체크인 실행
        run: python scrape.py

      - name: 생성된 파일 확인 (디버그)
        run: |
          echo "--- 현재 폴더 구조 ---"
          ls -la
          echo "--- rank_log.csv 내용 (있다면) ---"
          cat rank_log.csv 2>/dev/null || echo "rank_log.csv 없음"
          echo "--- screenshots 폴더 (있다면) ---"
          ls -la screenshots 2>/dev/null || echo "screenshots 폴더 없음"

      - name: 결과 커밋
        run: |
          git config user.name "qoo10-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          echo "--- git status ---"
          git status
          git commit -m "rank check-in $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "커밋할 변경사항이 없었어요"
          git push
